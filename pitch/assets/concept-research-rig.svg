<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Surface EMG research rig concept</title>
  <desc id="desc">An original schematic showing a textile neck interface, eight illustrative electrode sites, a removable edge module, and explicit labels that placement and form factor are not validated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17231f"/><stop offset="1" stop-color="#101816"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#294a42"/><stop offset=".5" stop-color="#1e302b"/><stop offset="1" stop-color="#294a42"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="560" rx="28" fill="url(#bg)" stroke="#53665f"/>
  <g fill="none" stroke="#5d716a" stroke-width="2" opacity=".65">
    <path d="M0 84H900M0 168H900M0 252H900M0 336H900M0 420H900M112 0V560M224 0V560M336 0V560M448 0V560M560 0V560M672 0V560M784 0V560"/>
  </g>
  <text x="48" y="58" fill="#5cd3bd" font-family="monospace" font-size="18" font-weight="700">ORIGINAL SCHEMATIC / RESEARCH RIG CONCEPT</text>
  <text x="48" y="87" fill="#9aa8a2" font-family="sans-serif" font-size="16">No hardware exists · anatomy, channels and enclosure remain TBD</text>
  <path d="M236 218 C320 158 576 158 664 218 L644 367 C557 411 343 411 256 367 Z" fill="url(#band)" stroke="#72a99a" stroke-width="3"/>
  <path d="M278 234 C360 200 542 200 622 234" fill="none" stroke="#8cc9b8" stroke-width="3" stroke-dasharray="8 9"/>
  <path d="M300 347 C385 374 517 374 601 347" fill="none" stroke="#8cc9b8" stroke-width="3" stroke-dasharray="8 9"/>
  <g fill="#ddeb79" stroke="#101816" stroke-width="5" filter="url(#glow)">
    <circle cx="305" cy="255" r="13"/><circle cx="385" cy="228" r="13"/><circle cx="470" cy="222" r="13"/><circle cx="555" cy="232" r="13"/>
    <circle cx="322" cy="330" r="13"/><circle cx="408" cy="350" r="13"/><circle cx="494" cy="350" r="13"/><circle cx="580" cy="328" r="13"/>
  </g>
  <g fill="#d9e4df" font-family="monospace" font-size="13"><text x="290" y="286">CH01</text><text x="370" y="260">CH02</text><text x="455" y="254">CH03</text><text x="540" y="264">CH04</text><text x="307" y="363">CH05</text><text x="393" y="383">CH06</text><text x="479" y="383">CH07</text><text x="565" y="361">CH08</text></g>
  <g transform="translate(664 246)">
    <rect width="142" height="108" rx="18" fill="#233c36" stroke="#5cd3bd" stroke-width="3"/>
    <rect x="18" y="20" width="38" height="29" rx="4" fill="#101816" stroke="#819a91"/>
    <path d="M70 27h50M70 38h35M18 67h102M18 82h72" stroke="#ddeb79" stroke-width="4" stroke-linecap="round"/>
    <text x="18" y="101" fill="#aebcb7" font-family="monospace" font-size="11">EDGE MODULE / TBD</text>
  </g>
  <path d="M652 300H620" stroke="#5cd3bd" stroke-width="3" stroke-dasharray="5 6"/>
  <g transform="translate(48 450)">
    <rect width="804" height="66" rx="12" fill="#251f1a" stroke="#a9694f"/>
    <circle cx="28" cy="33" r="9" fill="#ff8b5c"/>
    <text x="52" y="28" fill="#f1ddd4" font-family="sans-serif" font-size="16" font-weight="700">FORM FACTOR FOLLOWS SIGNAL EVIDENCE</text>
    <text x="52" y="49" fill="#c0a79d" font-family="sans-serif" font-size="13">Dots illustrate test channels—not validated sites, comfort, safety, manufacturability or an e&amp; device.</text>
  </g>
</svg>
