<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Confirmation-first silent command pipeline</title>
  <desc id="desc">An original left-to-right diagram showing unlock and consent, surface EMG quality, a fixed grammar candidate decoder, abstention and confirmation, then an existing assistant sandbox. Raw signals end at the decoder boundary.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5cd3bd"/></marker><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21332d"/><stop offset="1" stop-color="#17231f"/></linearGradient></defs>
  <rect width="1200" height="430" rx="26" fill="#101816" stroke="#53665f"/>
  <text x="45" y="54" fill="#5cd3bd" font-family="monospace" font-size="18" font-weight="700">ORIGINAL DIAGRAM / PROPOSED DATA FLOW</text>
  <g font-family="sans-serif">
    <g transform="translate(45 105)"><rect width="185" height="178" rx="18" fill="url(#panel)" stroke="#5c726a"/><text x="22" y="37" fill="#ddeb79" font-family="monospace" font-size="14">01 / UNLOCK</text><text x="22" y="74" fill="#f4f0e6" font-size="23" font-weight="700">Consent + active</text><text x="22" y="105" fill="#abb8b2" font-size="15">deliberate start</text><text x="22" y="130" fill="#abb8b2" font-size="15">visible state</text><text x="22" y="155" fill="#abb8b2" font-size="15">manual fallback</text></g>
    <g transform="translate(275 105)"><rect width="185" height="178" rx="18" fill="url(#panel)" stroke="#5c726a"/><text x="22" y="37" fill="#ddeb79" font-family="monospace" font-size="14">02 / CAPTURE</text><text x="22" y="74" fill="#f4f0e6" font-size="23" font-weight="700">sEMG + quality</text><text x="22" y="105" fill="#abb8b2" font-size="15">contact / dropout</text><text x="22" y="130" fill="#abb8b2" font-size="15">motion / artifact</text><text x="22" y="155" fill="#abb8b2" font-size="15">sites remain TBD</text></g>
    <g transform="translate(505 105)"><rect width="185" height="178" rx="18" fill="url(#panel)" stroke="#5c726a"/><text x="22" y="37" fill="#ddeb79" font-family="monospace" font-size="14">03 / DECODE</text><text x="22" y="74" fill="#f4f0e6" font-size="23" font-weight="700">Fixed grammar</text><text x="22" y="105" fill="#abb8b2" font-size="15">candidate list</text><text x="22" y="130" fill="#abb8b2" font-size="15">abstain / reject</text><text x="22" y="155" fill="#abb8b2" font-size="15">calibration TBD</text></g>
    <g transform="translate(735 105)"><rect width="185" height="178" rx="18" fill="#29251d" stroke="#ddeb79"/><text x="22" y="37" fill="#ddeb79" font-family="monospace" font-size="14">04 / HUMAN GATE</text><text x="22" y="74" fill="#f4f0e6" font-size="23" font-weight="700">Confirm / repair</text><text x="22" y="105" fill="#d0cbb6" font-size="15">preview intent</text><text x="22" y="130" fill="#d0cbb6" font-size="15">correct / reject</text><text x="22" y="155" fill="#d0cbb6" font-size="15">authorize separately</text></g>
    <g transform="translate(965 105)"><rect width="190" height="178" rx="18" fill="url(#panel)" stroke="#5c726a"/><text x="22" y="37" fill="#ddeb79" font-family="monospace" font-size="14">05 / SANDBOX</text><text x="22" y="74" fill="#f4f0e6" font-size="23" font-weight="700">Existing agent</text><text x="22" y="105" fill="#abb8b2" font-size="15">confirmed text</text><text x="22" y="130" fill="#abb8b2" font-size="15">minimum audit</text><text x="22" y="155" fill="#abb8b2" font-size="15">reply channel TBD</text></g>
  </g>
  <g stroke="#5cd3bd" stroke-width="4" marker-end="url(#arrow)"><path d="M232 194H267"/><path d="M462 194H497"/><path d="M692 194H727"/><path d="M922 194H957"/></g>
  <path d="M290 326H673" stroke="#ff8b5c" stroke-width="3" stroke-dasharray="8 7"/><path d="M673 326l-12-8v16z" fill="#ff8b5c"/>
  <text x="290" y="354" fill="#ffb093" font-family="monospace" font-size="14">RAW-SIGNAL BOUNDARY / DESIGN TARGET: NO EGRESS IN USE</text>
  <text x="45" y="402" fill="#8f9b96" font-family="sans-serif" font-size="14">Concept architecture—not implemented security, privacy, latency, hardware or integration evidence.</text>
</svg>
